<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Speed Dial</title>
  <style>
    :root {
      --bg: #111827;
      --fg: #f3f4f6;
      --muted: #a8b3c2;
      --card: #1f2937;
      --card-hover: #2b3a4f;
      --border: rgba(148, 163, 184, .24);
      --accent: #4f8cff;
      --shadow: 0 10px 30px rgba(2, 6, 23, .28);
      --radius: 18px;
    }
    [data-theme="light"] {
      --bg: #F1F1ED;
      --fg: #1a1d24;
      --muted: #4d5561;
      --card: #FDFDFD;
      --card-hover: #DBDBD0;
      --border: rgba(127,127,127,.22);
      --accent: #E27F5C;
      --shadow: 0 12px 28px rgba(0,0,0,.08);
    }

    html, body { height: 100%; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg) fixed center/cover no-repeat; color: var(--fg);
      display: grid; grid-template-rows: auto 1fr; gap: 14px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr minmax(auto, 660px) 1fr;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      box-sizing: border-box;
      position: relative;
    }
    header h1 {
      font-size: 20px;
      margin: 0;
      letter-spacing: .2px;
      white-space: nowrap;
      justify-self: start;
    }
    .spacer { display: none; }

    .toolbar {
      display: inline-flex;
      flex-direction: row-reverse;
      align-items: center;
      gap: 8px;
      position: absolute;
      top: 18px;
      right: 22px;
      z-index: 20;
      white-space: nowrap;
    }
    .toolbar-toggle {
      appearance: none;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border: 1px solid var(--border);
      border-radius: 13px;
      cursor: pointer;
      background: var(--card);
      color: var(--fg);
      box-shadow: var(--shadow);
      font-size: 20px;
      line-height: 1;
      transition: background .2s ease, transform .2s ease;
    }
    .toolbar-toggle svg {
      display: block;
      width: 22px;
      height: 22px;
      margin: auto;
      fill: currentColor;
    }
    .toolbar-toggle:hover,
    .toolbar-toggle:focus-visible { background: var(--card-hover); }
    .toolbar-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 0;
      padding: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateX(18px);
      border: 1px solid transparent;
      border-radius: 15px;
      background: var(--card);
      box-shadow: var(--shadow);
      transition: max-width .24s ease, opacity .16s ease, transform .24s ease, padding .24s ease, border-color .24s ease;
    }
    .toolbar:hover .toolbar-actions,
    .toolbar:focus-within .toolbar-actions,
    .toolbar.toolbar-open .toolbar-actions {
      max-width: 390px;
      padding: 4px;
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
      border-color: var(--border);
    }
    .toolbar.toolbar-open .toolbar-actions { padding: 4px; }
    .toolbar.toolbar-open .toolbar-toggle {
      transform: scale(1.05);
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .btn { appearance: none; border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer; background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
    .btn:hover { background: var(--card-hover); }
    .btn.primary { background: var(--accent); color: white; }
    .btn.primary:hover { filter: brightness(1.05); }
    .toolbar-actions .btn {
      min-height: 36px;
      padding: 8px 14px;
    }

    .switch { display: inline-flex; align-items: center; gap: 8px; user-select: none; }
    .switch input { appearance: none; width: 46px; height: 26px; border-radius: 999px; background: rgba(127,127,127,.35); position: relative; outline: none; cursor: pointer; transition: background .2s; }
    .switch input::after { content: ""; position: absolute; width: 20px; height: 20px; top: 3px; left: 3px; border-radius: 999px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
    .switch input:checked { background: var(--accent); }
    .switch input:checked::after { transform: translateX(20px); }

    .search-box {
      width: 100%;
      max-width: 660px;
      height: 44px;
      display: flex;
      align-items: center;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 0 12px;
      box-sizing: border-box;
      justify-self: center;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    @media (max-width: 800px) {
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .toolbar {
        margin-left: 0;
      }
      .toolbar-actions { max-width: min(390px, calc(100vw - 76px)); }
      .search-box {
        order: 3;
        max-width: 100%;
      }
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.2), var(--shadow);
    }

    [data-theme="light"] .search-box:focus-within {
      box-shadow: 0 0 0 3px rgba(226, 127, 92, 0.2), var(--shadow);
    }

    .search-icon {
      flex-shrink: 0;
      color: var(--muted);
      margin-right: 8px;
      pointer-events: none;
    }

    .search-input {
      flex: 1;
      height: 100%;
      border: 0 !important;
      outline: none !important;
      background: transparent !important;
      color: var(--fg) !important;
      font-size: 16px;
      font-family: inherit;
      padding: 0 !important;
      min-width: 0;
    }

    .search-input::placeholder {
      color: var(--muted);
      opacity: 0.8;
    }

    .search-input::-webkit-search-cancel-button,
    .search-input::-webkit-search-decoration {
      display: none;
    }

    .search-clear-btn {
      appearance: none;
      border: 0;
      background: rgba(127,127,127,.18);
      color: var(--fg);
      width: 18px;
      height: 18px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 11px;
      cursor: pointer;
      margin-left: 6px;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
    }

    .search-clear-btn:hover {
      background: rgba(127,127,127,.32);
    }

    .grid {
      padding: 50px 18px 80px;
      width: min(1300px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      align-items: stretch;
      grid-auto-rows: 120px;
    }

    .tile {
      user-select: none;
      background: var(--card);
      border-radius: 18px;
      padding: 4px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: minmax(32px, auto) minmax(16px, auto) minmax(11px, auto);
      align-items: start;
      gap: 2px;
      color: inherit;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      outline: 2px solid transparent;
      transition: transform .08s ease, outline-color .2s ease, background .2s ease;
      box-sizing: border-box;
      height: 100%;
      margin: 0;
      cursor: grab;
      text-decoration: none;
      display: flex;
      flex-direction: column;
    }
    .tile:hover { background: var(--card-hover); transform: translateY(-2px); }
    .tile:active { transform: translateY(0); }
    .tile.sortable-ghost { opacity: 0.4; background: var(--card-hover); }
    .tile.sortable-drag { opacity: 0.8; }

    .favicon { width: 32px; height: 32px; border-radius: 1px; display: inline-grid; place-items: center; margin-left: 8px; margin-top: 8px; flex-shrink: 0; }
    .favicon img { width: 100%; height: 100%; border-radius: 1px; object-fit: contain; }

    .title { font-weight: 600; font-size: 14px; line-height: 1.2; text-align: left; margin-left: 8px; margin-top: 1px; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; }
    .host { color: var(--muted); font-size: 11px; margin-left: 8px; margin-top: 4px; margin-bottom: 5px; overflow: hidden; text-overflow: ellipsis; }

    .tile .actions { position: absolute; right: 8px; top: 8px; display: flex; gap: 6px; opacity: 0; pointer-events: none; transition: opacity .15s; }
    .tile.actions-visible .actions { opacity: 1; pointer-events: auto; }
    .iconbtn { width: 30px; height: 30px; border-radius: 10px; border: 0; cursor: pointer; display: grid; place-items: center; background: rgba(127,127,127,.12); color: var(--fg); }
    .iconbtn:hover { background: rgba(127,127,127,.22); }
    .icon { width: 18px; height: 18px; display: inline-block; }

    .fab { position: fixed; right: 22px; bottom: 22px; z-index: 20; border-radius: 18px; padding: 14px 16px; font-weight: 600; }

    dialog { border: 0; border-radius: 16px; background: var(--card); color: var(--fg); padding: 0; box-shadow: var(--shadow); width: min(520px, 92vw); }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    .dlg-head { padding: 18px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
    .dlg-body { padding: 18px 20px; display: grid; gap: 12px; }
    .dlg-foot { padding: 14px 20px 18px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--border); }

    label { font-size: 12px; color: var(--muted); }
    input[type="text"], input[type="url"] { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); }
    .row { display: grid; gap: 8px; }

    .empty { opacity: .6; text-align: center; padding: 40px 20px; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Speed Dial</h1>
    <form class="search-box" id="searchForm" action="https://www.google.com/search" method="get">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="searchInput" name="q" class="search-input" type="search" placeholder="Search Google..." autocomplete="off" spellcheck="false" aria-label="Search Google" />
      <button id="searchClear" class="search-clear-btn" type="button" title="Clear search" aria-label="Clear search" hidden>✕</button>
    </form>
    <div class="toolbar" id="toolbar">
      <button class="toolbar-toggle" id="toolbarToggle" type="button" aria-label="Show settings" aria-expanded="false" aria-controls="toolbarActions" title="Show settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><title>cog-outline</title><path d="M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8M12,10A2,2 0 0,0 10,12A2,2 0 0,0 12,14A2,2 0 0,0 14,12A2,2 0 0,0 12,10M10,22C9.75,22 9.54,21.82 9.5,21.58L9.13,18.93C8.5,18.68 7.96,18.34 7.44,17.94L4.95,18.95C4.73,19.03 4.46,18.95 4.34,18.73L2.34,15.27C2.21,15.05 2.27,14.78 2.46,14.63L4.57,12.97L4.5,12L4.57,11L2.46,9.37C2.27,9.22 2.21,8.95 2.34,8.73L4.34,5.27C4.46,5.05 4.73,4.96 4.95,5.05L7.44,6.05C7.96,5.66 8.5,5.32 9.13,5.07L9.5,2.42C9.54,2.18 9.75,2 10,2H14C14.25,2 14.46,2.18 14.5,2.42L14.87,5.07C15.5,5.32 16.04,5.66 16.56,6.05L19.05,5.05C19.27,4.96 19.54,5.05 19.66,5.27L21.66,8.73C21.79,8.95 21.73,9.22 21.54,9.37L19.43,11L19.5,12L19.43,13L21.54,14.63C21.73,14.78 21.79,15.05 21.66,15.27L19.66,18.73C19.54,19.04 19.27,19.04 19.05,18.95L16.56,17.95C16.04,18.34 15.5,18.68 14.87,18.93L14.5,21.58C14.46,21.82 14.25,22 14,22H10M11.25,4L10.88,6.61C9.68,6.86 8.62,7.5 7.85,8.39L5.44,7.35L4.69,8.65L6.8,10.2C6.4,11.37 6.4,12.64 6.8,13.8L4.68,15.36L5.43,16.66L7.86,15.62C8.63,16.5 9.68,17.14 10.87,17.38L11.24,20H12.76L13.13,17.39C14.32,17.14 15.37,16.5 16.14,15.62L18.57,16.66L19.32,15.36L17.2,13.81C17.6,12.64 17.6,11.37 17.2,10.2L19.31,8.65L18.56,7.35L16.15,8.39C15.38,7.5 14.32,6.86 13.12,6.62L12.75,4H11.25Z" /></svg>
      </button>
      <div class="toolbar-actions" id="toolbarActions">
        <label class="switch" title="Toggle light/dark">
          <input id="themeToggle" type="checkbox" />
          <span>Light</span>
        </label>
        <button class="btn" id="btnExport" title="Export dials to JSON">Export</button>
        <button class="btn" id="btnImport" title="Import dials from JSON">Import</button>
      </div>
      <input id="fileImport" type="file" accept="application/json" hidden />
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <button class="btn primary fab" id="btnAdd">＋ Add Dial</button>

  <dialog id="dlg">
    <div class="dlg-head">
      <strong id="dlgTitle">Add Dial</strong>
      <div class="spacer"></div>
    </div>
    <div class="dlg-body">
      <div class="row">
        <label for="fUrl">URL</label>
        <input id="fUrl" type="url" placeholder="https://example.com or file:///D:/folder/page.html" required />
      </div>
      <div class="row">
        <label for="fTitle">Title (optional)</label>
        <input id="fTitle" type="text" placeholder="Shown on the tile" />
      </div>
      <div class="row">
        <label for="fIcon">Icon URL (optional)</label>
        <input id="fIcon" type="url" placeholder="https://site.com/favicon.ico" />
        <label for="fIconHtml">Use embedded icon from HTML (optional)</label>
        <input id="fIconHtml" type="file" accept=".html,.htm,text/html" />
        <small id="fIconStatus" role="status"></small>
      </div>
    </div>
    <div class="dlg-foot">
      <button class="btn" id="dlgCancel" type="button">Cancel</button>
      <button class="btn primary" id="dlgSave" type="button">Save</button>
    </div>
  </dialog>

  <script>
  /*!
   * Minimal Sortable-compatible helper for this page.
   * Supports the subset used below: create(), destroy(),
   * ghostClass, dragClass, handle, and onEnd.
   */
  (function (global) {

      return Boolean(target.closest('button, input, select, textarea, label, a'));
    }

    function getDragHandle(container, target, handleSelector) {
      if (!target || !container.contains(target)) return null;
      if (!handleSelector) {
        return target.closest(':scope > *');
      }
      const handle = target.closest(handleSelector);
      if (!handle || handle.parentElement !== container) return null;
      return handle;
    }

    function SortableLite(container, options) {
      this.container = container;
      this.options = options || {};
      this.threshold = 6;
      this.dragged = null;
      this.dragPlaceholder = null;
      this.pendingItem = null;
      this.startX = 0;
      this.startY = 0;
      this.lastX = 0;
      this.lastY = 0;
      this.offsetX = 0;
      this.offsetY = 0;
      this.oldIndex = -1;
      this.suppressClick = false;
      this.touchMoveOptions = { capture: true, passive: false };

      this.onMouseDown = this.onMouseDown.bind(this);
      this.onMouseMove = this.onMouseMove.bind(this);
      this.onMouseUp = this.onMouseUp.bind(this);
      this.onTouchStart = this.onTouchStart.bind(this);
      this.onTouchMove = this.onTouchMove.bind(this);
      this.onTouchEnd = this.onTouchEnd.bind(this);
      this.onClickCapture = this.onClickCapture.bind(this);

      container.addEventListener('mousedown', this.onMouseDown);
      container.addEventListener('touchstart', this.onTouchStart, { passive: true });
      container.addEventListener('click', this.onClickCapture, true);
    }

    SortableLite.prototype.items = function () {
      return Array.from(this.container.children);
    };

    SortableLite.prototype.onMouseDown = function (event) {
      if (event.button !== 0) return;
      const item = getDragHandle(this.container, event.target, this.options.handle);
      if (!item || isInteractiveElement(event.target)) return;
      this.beginPending(item, event.clientX, event.clientY);
      document.addEventListener('mousemove', this.onMouseMove, true);
      document.addEventListener('mouseup', this.onMouseUp, true);
    };

    SortableLite.prototype.onTouchStart = function (event) {
      if (event.touches.length !== 1) return;
      const touch = event.touches[0];
      const item = getDragHandle(this.container, event.target, this.options.handle);
      if (!item || isInteractiveElement(event.target)) return;
      this.beginPending(item, touch.clientX, touch.clientY);

    SortableLite.prototype.beginPending = function (item, x, y) {

    SortableLite.prototype.handleMove = function (x, y, event) {

    SortableLite.prototype.startDrag = function (item, x, y) {

    SortableLite.prototype.onTouchEnd = function () {

    SortableLite.prototype.finishDrag = function () {
      document.removeEventListener('mousemove', this.onMouseMove, true);

        this.pendingItem = null;
        return;

      const dragged = this.dragged;
      const placeholder = this.dragPlaceholder;
      const newIndex = this.items().indexOf(placeholder);

      dragged.classList.remove(this.options.dragClass || 'sortable-drag');
      dragged.style.width = '';
      dragged.style.height = '';
      dragged.style.position = '';
      dragged.style.left = '';
      dragged.style.top = '';
      dragged.style.margin = '';
      dragged.style.zIndex = '';
      dragged.style.pointerEvents = '';
      dragged.style.boxSizing = '';
      dragged.style.transition = '';
      dragged.style.transform = '';

      this.container.replaceChild(dragged, placeholder);

      this.dragged = null;
      this.dragPlaceholder = null;
      this.pendingItem = null;

    };

      this.finishDrag();
      this.container.removeEventListener('mousedown', this.onMouseDown);
      this.container.removeEventListener('touchstart', this.onTouchStart, { passive: true });
      this.container.removeEventListener('click', this.onClickCapture, true);
    };

    global.Sortable = {
      create: function (container, options) {
        return new SortableLite(container, options);
      }
    };
  }(window));
  </script>

  <script>
  const LS_KEY = 'quickdial.v1.items';
  const LS_THEME = 'quickdial.theme';

  let items = [];
  let editingId = null;
  let sortableInstance = null;

  const grid = document.getElementById('grid');
  const searchForm = document.getElementById('searchForm');
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');
  const dlg = document.getElementById('dlg');
  const fUrl = document.getElementById('fUrl');
  const fTitle = document.getElementById('fTitle');
  const fIcon = document.getElementById('fIcon');
  const fIconHtml = document.getElementById('fIconHtml');
  const fIconStatus = document.getElementById('fIconStatus');
  fIconHtml.addEventListener('change', async () => {
    const file = fIconHtml.files[0];
    if (!file) return;
    try {
      const doc = new DOMParser().parseFromString(await file.text(), 'text/html');
      const icon = Array.from(doc.querySelectorAll('link[rel][href]')).find(link =>
        link.getAttribute('rel').toLowerCase().split(/\s+/).includes('icon') &&
        /^data:image\//i.test(link.getAttribute('href')));
      if (!icon) throw new Error('No embedded image favicon found in this HTML file.');
      const iconUrl = icon.getAttribute('href');
      await fetchIconData(iconUrl);
      fIcon.value = iconUrl;
      fIconStatus.textContent = 'Embedded favicon loaded. Click Save to use it.';
    } catch (err) {
      fIconStatus.textContent = err.message;
    } finally {
      fIconHtml.value = '';
    }
  });
  const themeToggle = document.getElementById('themeToggle');
  const toolbar = document.getElementById('toolbar');
  const toolbarToggle = document.getElementById('toolbarToggle');
  const btnAdd = document.getElementById('btnAdd');
  const btnExport = document.getElementById('btnExport');
  const btnImport = document.getElementById('btnImport');
  const fileImport = document.getElementById('fileImport');
  const dlgSave = document.getElementById('dlgSave');
  const dlgCancel = document.getElementById('dlgCancel');

  function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  function save() { localStorage.setItem(LS_KEY, JSON.stringify(items)); }
  function isSupportedUrl(url) {
    try { return ['http:', 'https:', 'file:'].includes(new URL(url).protocol); }
    catch { return false; }
  }
  function getHost(url) {
    try {
      const u = new URL(url);
      return u.protocol === 'file:' ? decodeURIComponent(u.pathname.split('/').filter(Boolean).pop() || '') : u.host;
    } catch { return url; }
  }
  function defaultTitle(url) { const h = getHost(url); return h.replace(/^www\./,''); }
  function guessIcon(url) { try { const u = new URL(url); return /^https?:$/.test(u.protocol) ? `${u.protocol}//${u.host}/favicon.ico` : ''; } catch { return ''; } }
  function s2Favicon(url) { try { const u = new URL(url); return /^https?:$/.test(u.protocol) ? `https://www.google.com/s2/favicons?sz=128&domain_url=${encodeURIComponent(u.origin)}` : ''; } catch { return ''; } }

  function readBlobAsDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(blob);
    });
  }

  async function fetchIconData(url) {
    if (!url) return '';
    const response = await fetch(url, { cache: 'force-cache', referrerPolicy: 'no-referrer' });
    if (!response.ok) throw new Error('Icon request failed');
    const blob = await response.blob();
    if ((blob.type && !blob.type.startsWith('image/')) || blob.size > 100 * 1024) throw new Error('Icon is not a small image');
    return readBlobAsDataUrl(blob);
  }

  async function cacheIconForItem(item) {
    const candidates = [item.icon, guessIcon(item.url), s2Favicon(item.url)].filter(Boolean);
    const uniqueCandidates = Array.from(new Set(candidates));
    for (const iconUrl of uniqueCandidates) {
      try {
        const iconData = await fetchIconData(iconUrl);
        if (iconData) {
          item.iconData = iconData;
          item.iconCachedFrom = iconUrl;
          item.iconCachedAt = Date.now();
          return true;
        }
      } catch {
        // Try the next source. Some sites block direct favicon downloads with CORS.
      }
    }
    return false;
  }

  function shouldRefreshIconCache(item, url, icon) {
    return !item.iconData || item.url !== url || (item.icon || '') !== icon;
  }

  function saveAfterIconCache() {
    try {
      save();
    } catch (err) {
      console.warn('Icon cache could not be saved. Local storage may be full.', err);
    }
  }

  async function cacheMissingIcons() {
    const missing = items.filter(item => item.url && !item.iconData);
    for (const item of missing) {
      const changed = await cacheIconForItem(item);
      if (changed) {
        saveAfterIconCache();
        render();
      }
    }
  }

  function applyThemeFromStorage() {
    const t = localStorage.getItem(LS_THEME) || 'light';
    document.documentElement.setAttribute('data-theme', t);
    themeToggle.checked = (t === 'light');
  }

  function render() {
    grid.innerHTML = '';
    if (!items.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = 'No dials yet. Click <b>Add Dial</b> to create your first.';
      grid.appendChild(empty);
      sortableInstance = null;
      return;
    }
    items.forEach(it => grid.appendChild(renderTile(it)));
    
    // Initialize SortableJS after rendering
    if (sortableInstance) {
      sortableInstance.destroy();
    }
    initSortable();
  }

  function renderTile(it) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.id = it.id;

    // Icon
    const icoWrap = document.createElement('div');
    icoWrap.className = 'favicon';
    const img = document.createElement('img');
    img.alt = '';
    img.referrerPolicy = 'no-referrer';
    const iconSource = it.iconData || it.icon || guessIcon(it.url);
    if (iconSource) img.src = iconSource;
    img.addEventListener('error', () => {
      const fallback = s2Favicon(it.url);
      if (fallback && img.src !== fallback) img.src = fallback;
    });
    icoWrap.appendChild(img);

    // Title and host
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = it.title || defaultTitle(it.url);

    const host = document.createElement('div');
    host.className = 'host';
    host.textContent = getHost(it.url);

    // Actions
    const actions = document.createElement('div');
    actions.className = 'actions';
    
    const btnEdit = document.createElement('button');
    btnEdit.type = 'button';
    btnEdit.className = 'iconbtn';
    btnEdit.title = 'Edit';
    btnEdit.innerHTML = '<span class="icon">✎</span>';
    btnEdit.addEventListener('click', (e) => {
      e.stopPropagation();
      openEdit(it.id);
    });

    const btnDelete = document.createElement('button');
    btnDelete.type = 'button';
    btnDelete.className = 'iconbtn';
    btnDelete.title = 'Delete';
    btnDelete.innerHTML = '<span class="icon">✕</span>';
    btnDelete.addEventListener('click', (e) => {
      e.stopPropagation();
      remove(it.id);
    });

    actions.appendChild(btnEdit);
    actions.appendChild(btnDelete);

    // Context menu for actions
    tile.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      document.querySelectorAll('.tile.actions-visible').forEach(t => t.classList.remove('actions-visible'));
      tile.classList.add('actions-visible');
    });

    // Click to navigate (but not if dragging)
    tile.addEventListener('click', (e) => {
      if (e.target.closest('.actions')) return;
      // Don't navigate if item was just reordered
      if (!tile.classList.contains('sortable-ghost')) {
        window.location.href = it.url;
      }
    });

    tile.appendChild(icoWrap);
    tile.appendChild(title);
    tile.appendChild(host);
    tile.appendChild(actions);

    return tile;
  }

  function initSortable() {
    sortableInstance = Sortable.create(grid, {
      animation: 150,
      ghostClass: 'sortable-ghost',
      dragClass: 'sortable-drag',
      handle: '.tile',
      forceFallback: false,
      onEnd: (evt) => {
        // Reorder items array based on new DOM order
        const newOrder = Array.from(grid.querySelectorAll('.tile')).map(t => t.dataset.id);
        const newItems = [];
        for (const id of newOrder) {
          const item = items.find(x => x.id === id);
          if (item) newItems.push(item);
        }
        items = newItems;
        save();
      }
    });
  }

  function openAdd() {
    editingId = null;
    document.getElementById('dlgTitle').textContent = 'Add Dial';
    fUrl.value = '';
    fTitle.value = '';
    fIcon.value = '';
    fIconStatus.textContent = '';
    dlg.showModal();
  }

  function openEdit(id) {
    editingId = id;
    const it = items.find(x => x.id === id);
    if (!it) return;
    document.getElementById('dlgTitle').textContent = 'Edit Dial';
    fUrl.value = it.url;
    fTitle.value = it.title || '';
    fIcon.value = it.icon || '';
    fIconStatus.textContent = '';
    dlg.showModal();
  }

  async function upsertFromForm() {
    const url = fUrl.value.trim();
    if (!isSupportedUrl(url)) {
      alert('Please enter a valid http(s) or file:/// URL.');
      return false;
    }
    const title = fTitle.value.trim();
    const icon = fIcon.value.trim();
    let item;
    if (editingId) {
      const i = items.findIndex(x => x.id === editingId);
      if (i >= 0) {
        const existing = items[i];
        const refreshIcon = shouldRefreshIconCache(existing, url, icon);
        item = {
          ...existing,
          url,
          title,
          icon,
          iconData: refreshIcon ? '' : existing.iconData,
          iconCachedFrom: refreshIcon ? '' : existing.iconCachedFrom,
          iconCachedAt: refreshIcon ? 0 : existing.iconCachedAt
        };
        items[i] = item;
      }
    } else {
      item = { id: uid(), url, title, icon, iconData: '', iconCachedFrom: '', iconCachedAt: 0, added: Date.now() };
      items.push(item);
    }
    if (item) await cacheIconForItem(item);
    save();
    render();
    return true;
  }

  function remove(id) {
    if (!confirm('Remove this dial?')) return;
    items = items.filter(x => x.id !== id);
    save();
    render();
  }

  function exportJson() {
    const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'quick-dial.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function importJson(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error('Invalid format');
        const map = new Map(items.map(x => [x.url, x]));
        for (const p of parsed) {
          if (!p || typeof p !== 'object' || !p.url) continue;
          const rec = {
            id: p.id || uid(),
            url: String(p.url),
            title: String(p.title || ''),
            icon: String(p.icon || ''),
            iconData: String(p.iconData || ''),
            iconCachedFrom: String(p.iconCachedFrom || ''),
            iconCachedAt: Number(p.iconCachedAt || 0),
            added: Number(p.added || Date.now())
          };
          map.set(rec.url, rec);
        }
        items = Array.from(map.values());
        save();
        render();
      } catch (err) {
        alert('Failed to import: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  // Initialize
  try {
    items = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
  } catch {
    items = [];
  }
  applyThemeFromStorage();
  render();

  // Hide action menu on outside click
  document.addEventListener('click', () => {
    document.querySelectorAll('.tile.actions-visible').forEach(t => t.classList.remove('actions-visible'));
  });

  toolbarToggle.addEventListener('click', (event) => {
    event.stopPropagation();
    const isOpen = toolbar.classList.toggle('toolbar-open');
    toolbarToggle.setAttribute('aria-expanded', String(isOpen));
    toolbarToggle.toggleAttribute('title', !isOpen);
    if (!isOpen) toolbarToggle.setAttribute('title', 'Show settings');
  });
  document.addEventListener('click', (event) => {
    if (!toolbar.contains(event.target)) {
      toolbar.classList.remove('toolbar-open');
      toolbarToggle.setAttribute('aria-expanded', 'false');
      toolbarToggle.setAttribute('title', 'Show settings');
    }
  });

  // Event listeners
  dlgSave.addEventListener('click', async () => {
    dlgSave.disabled = true;
    const oldText = dlgSave.textContent;
    dlgSave.textContent = 'Saving...';
    try {
      if (await upsertFromForm()) dlg.close();
    } finally {
      dlgSave.disabled = false;
      dlgSave.textContent = oldText;
    }
  });
  dlgCancel.addEventListener('click', () => dlg.close());

  btnAdd.addEventListener('click', openAdd);
  btnExport.addEventListener('click', exportJson);
  btnImport.addEventListener('click', () => fileImport.click());
  fileImport.addEventListener('change', () => {
    const f = fileImport.files?.[0];
    if (f) importJson(f);
    fileImport.value = '';
  });

  searchInput.addEventListener('input', () => {
    searchClear.hidden = (searchInput.value.trim() === '');
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (searchInput.value) {
        searchInput.value = '';
        searchClear.hidden = true;
      } else {
        searchInput.blur();
      }
    }
  });

  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.hidden = true;
    searchInput.focus();
  });

  searchForm.addEventListener('submit', (e) => {
    const q = (searchInput.value || '').trim();
    if (!q) {
      e.preventDefault();
      return;
    }
    if (/^https?:\/\//i.test(q)) {
      e.preventDefault();
      window.location.href = q;
    } else if (/^([a-z0-9]+(-[a-z0-9]+)*\.)+[a-z]{2,}(:\d+)?(\/.*)?$/i.test(q)) {
      e.preventDefault();
      window.location.href = 'https://' + q;
    }
  });

  themeToggle.addEventListener('change', () => {
    const theme = themeToggle.checked ? 'light' : 'dark';
    localStorage.setItem(LS_THEME, theme);
    applyThemeFromStorage();
  });

  // Keyboard shortcut
  window.addEventListener('keydown', (e) => {
    if (e.target instanceof Element && e.target.closest('input, textarea, select')) return;
    if (e.key.toLowerCase() === 'n' && !dlg.open) {
      e.preventDefault();
      openAdd();
    }
  });

  // Seed examples on first run
  if (!items.length && !localStorage.getItem('quickdial.seeded')) {
    items = [
      { id: uid(), url: 'https://www.google.com', title: 'Google', icon: '', iconData: '', iconCachedFrom: '', iconCachedAt: 0, added: Date.now() },
      { id: uid(), url: 'https://www.bing.com', title: 'Bing', icon: '', iconData: '', iconCachedFrom: '', iconCachedAt: 0, added: Date.now() }
    ];
    localStorage.setItem('quickdial.seeded', '1');
    save();
    render();
  }
  cacheMissingIcons();
  </script>
</body>
</html>
